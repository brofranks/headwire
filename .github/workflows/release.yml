name: Build and release

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    if: >-
      github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    env:
      CGO_ENABLED: '0'
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag and source
        if: github.ref_type == 'tag'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          git cat-file tag "$GITHUB_REF_NAME" | grep -q '^-----BEGIN \(SSH\|PGP\) SIGNATURE-----$'
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Development checks
        run: scripts/check.sh
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-linux
          path: dist/coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Select version
        id: version
        run: |
          version="dev-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Package archives, DEBs, and RPMs
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: scripts/release.sh "$RELEASE_VERSION"
      - name: Verify archives and native binary
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          cd "dist/$RELEASE_VERSION"
          sha256sum -c SHA256SUMS
          tar -xzf "headwire_${RELEASE_VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/headwire_${RELEASE_VERSION}_linux_amd64/headwire"
          test "$("$binary" version)" = "headwire $RELEASE_VERSION"
          "$binary" --help
          for arch in amd64 arm64; do
            unzip -l "headwire_${RELEASE_VERSION}_windows_$arch.zip" | grep -q '/wintun\.dll$'
          done
      - name: Install and remove Debian package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          sudo apt-get install -y "./dist/$RELEASE_VERSION/headwire_${RELEASE_VERSION}_linux_amd64.deb"
          test "$(/usr/bin/headwire version)" = "headwire $RELEASE_VERSION"
          /usr/bin/headwire --help
          cmp "$RUNNER_TEMP/headwire_${RELEASE_VERSION}_linux_amd64/headwire" /usr/bin/headwire
          test -f /usr/share/doc/headwire/licenses/tailscale.com/LICENSE
          test -f /usr/share/doc/headwire/headwire.conf.example
          test "$(dpkg-deb -f "./dist/$RELEASE_VERSION/headwire_${RELEASE_VERSION}_linux_arm64.deb" Architecture)" = arm64
          systemd-analyze verify /usr/lib/systemd/system/headwire.service
          sudo apt-get purge -y headwire
          test ! -e /usr/bin/headwire
          test ! -e /usr/lib/systemd/system/headwire.service
      - name: Install and remove RPM package on Fedora
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker run --rm -v "$PWD/dist/$RELEASE_VERSION:/packages:ro" -v "$RUNNER_TEMP:/archive:ro" \
            -e RELEASE_VERSION fedora:44 bash -euo pipefail -c '
              dnf install -y diffutils
              dnf install -y "/packages/headwire_${RELEASE_VERSION}_linux_amd64.rpm"
              test "$(headwire version)" = "headwire $RELEASE_VERSION"
              headwire --help
              cmp "/archive/headwire_${RELEASE_VERSION}_linux_amd64/headwire" /usr/bin/headwire
              test -f /usr/share/doc/headwire/licenses/tailscale.com/LICENSE
              test -f /usr/share/doc/headwire/headwire.conf.example
              test "$(rpm -qp --qf "%{ARCH}" "/packages/headwire_${RELEASE_VERSION}_linux_arm64.rpm")" = aarch64
              dnf remove -y headwire
              test ! -e /usr/bin/headwire
              test ! -e /usr/lib/systemd/system/headwire.service
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: dist/${{ steps.version.outputs.value }}/
          if-no-files-found: error
          retention-days: 14

  # The Linux runner type-checks the darwin and windows source but runs tests
  # only for its own OS, and it cross-builds their archives but cannot run
  # them. The native test jobs need no build output, so they run beside it.
  test-macos:
    if: >-
      github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Development checks
        run: scripts/check.sh
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-macos
          path: dist/coverage/
          if-no-files-found: warn
          retention-days: 14

  # The runner's account is an administrator, which the status pipe tests here
  # and the Wintun adapter in verify-windows both need.
  test-windows:
    if: >-
      github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # check.sh's shell linters and coverage run on Linux and macOS, so this
      # job vets and tests alone.
      - name: Vet and test
        shell: bash
        run: |
          . scripts/goflags.sh
          go vet ./...
          go test -race -count=1 ./...

  verify-macos:
    needs: build
    runs-on: macos-26
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: release
      - name: Verify archives and native binary
        run: |
          cd release
          shasum -a 256 -c SHA256SUMS
          tar -xzf "headwire_${RELEASE_VERSION}_darwin_arm64.tar.gz" -C "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/headwire_${RELEASE_VERSION}_darwin_arm64/headwire"
          test "$("$binary" version)" = "headwire $RELEASE_VERSION"
          "$binary" --help

  verify-windows:
    needs: build
    runs-on: windows-2025
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: release
      - name: Check checksums
        shell: bash
        run: cd release && sha256sum -c SHA256SUMS
      - name: Verify archive and run a node
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $name = "headwire_${env:RELEASE_VERSION}_windows_amd64"
          Expand-Archive "release\$name.zip" -DestinationPath $env:RUNNER_TEMP
          $bin = "$env:RUNNER_TEMP\$name\headwire.exe"
          if ((& $bin version) -ne "headwire $env:RELEASE_VERSION") { throw 'wrong version' }
          & $bin --help
          if ($LASTEXITCODE -ne 0) { throw 'help failed' }
          $conf = "$env:RUNNER_TEMP\main.conf"
          "[Interface]`nPrivateKey = $(& $bin genkey)`nAddress = 100.64.0.1/32`n" | Set-Content $conf
          $log = "$env:RUNNER_TEMP\node.log"
          $node = Start-Process -FilePath $bin -ArgumentList 'run', $conf -PassThru -NoNewWindow -RedirectStandardError $log
          try {
            $deadline = (Get-Date).AddSeconds(60)
            while ((& $bin ip 2>$null) -ne '100.64.0.1') {
              if ($node.HasExited -or (Get-Date) -gt $deadline) { throw 'the node did not answer' }
              Start-Sleep -Seconds 1
            }
            & $bin show
            if ($LASTEXITCODE -ne 0) { throw 'show failed' }
            Get-NetAdapter -Name Headwire
          } finally {
            Stop-Process -Id $node.Id -Force -ErrorAction SilentlyContinue
            Get-Content $log
          }

  # The Android library needs the NDK the Linux runner preinstalls. It gates
  # a release but is not one of its assets: the app repository builds it into
  # the APK.
  build-android:
    needs: build
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build libheadwire.so
        run: bridge/android/build.sh dist/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: dist/android/
          if-no-files-found: error
          retention-days: 14

  release:
    environment: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-macos, test-windows, verify-macos, verify-windows, build-android]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: release
      - name: Check checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          gh release create "$GITHUB_REF_NAME" ./*.tar.gz ./*.zip ./*.deb ./*.rpm SHA256SUMS \
            --verify-tag --draft --title "$GITHUB_REF_NAME" \
            --notes 'Replace these notes before publishing, describing what changed in this release.'
