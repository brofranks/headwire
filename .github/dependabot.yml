version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    ignore:
      # Every tag the fork inherited from upstream's pre-fork history outranks
      # a v0.0.0-<date>-<commit> pseudo-version and declares the module as
      # golang.zx2c4.com/wireguard, so proposing one fails the job on the path
      # mismatch. The requirement tracks tailscale.com's pseudo-version, which
      # no tag can supersede, so ignoring all of them hides no real update.
      - dependency-name: github.com/tailscale/wireguard-go
        versions: ['>= 0.0.1']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
